[project]
name = "theodore"
version = "0.1.0"
description = "AI post-production assistant for interview and documentary editing"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
theodore = "theodore.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["theodore*"]

[tool.setuptools.package-data]
"theodore.analyze" = ["prompts/*.md"]
